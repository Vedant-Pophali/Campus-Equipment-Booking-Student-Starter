apiVersion: apps/v1
kind: Deployment
metadata:
  name: campus-equipment-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: campus-equipment
  template:
    metadata:
      labels:
        app: campus-equipment
    spec:
      containers:
      - name: campus-equipment
        image: campus-equipment-booking:set-e
        imagePullPolicy: Never
        ports:
        - containerPort: 8080